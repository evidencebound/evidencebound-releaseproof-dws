name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m compileall -q src tests scripts
      - name: Validate synthetic live-probe PDFs
        run: |
          python scripts/generate_synthetic_trade_pdfs.py
          python - <<'PY'
          from pathlib import Path
          files=sorted(Path('live-probe-input').glob('*.pdf'))
          assert len(files)==3
          for path in files:
              data=path.read_bytes()
              assert data.startswith(b'%PDF-')
              assert data.rstrip().endswith(b'%%EOF')
          print('synthetic live-probe packet validated')
          PY
      - name: Validate nonmaterial revision bytes
        run: |
          python scripts/generate_synthetic_revision.py
          python - <<'PY'
          from pathlib import Path
          original=Path('live-probe-input/invoice.pdf').read_bytes()
          revised=Path('live-probe-revision/invoice-revised.pdf').read_bytes()
          assert original != revised
          assert original.replace(b'%%EOF\n', b'') == revised.replace(
              b'% ReleaseProof nonmaterial revision B\n%%EOF\n', b''
          )
          assert revised.rstrip().endswith(b'%%EOF')
          print('render-equivalent nonmaterial revision validated')
          PY

  source-snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Archive exact tested source tree
        run: |
          git archive --format=zip HEAD -o releaseproof-source.zip
          sha256sum releaseproof-source.zip > releaseproof-source.zip.sha256
          git rev-parse HEAD > tested-head.txt
      - uses: actions/upload-artifact@v4
        with:
          name: releaseproof-source-snapshot
          path: |
            releaseproof-source.zip
            releaseproof-source.zip.sha256
            tested-head.txt
          if-no-files-found: error
          retention-days: 30
