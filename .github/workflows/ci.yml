name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest -q
      - run: python -m compileall -q src tests scripts
      - name: Validate synthetic live-probe PDFs
        run: |
          python scripts/generate_synthetic_trade_pdfs.py
          python - <<'PY'
          from pathlib import Path
          files=sorted(Path('live-probe-input').glob('*.pdf'))
          assert len(files)==3
          for path in files:
              data=path.read_bytes()
              assert data.startswith(b'%PDF-')
              assert data.rstrip().endswith(b'%%EOF')
          print('synthetic live-probe packet validated')
          PY
