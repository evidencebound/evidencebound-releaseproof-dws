name: live-nutrient-dws

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'qa/LIVE_DWS_TRIGGER.md'

permissions:
  contents: read
  issues: write

jobs:
  live-dws-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NUTRIENT_API_KEY: ${{ secrets.NUTRIENT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: secret
        name: Require server-side Nutrient secret
        shell: bash
        run: |
          if [ -z "$NUTRIENT_API_KEY" ]; then
            echo "NUTRIENT_API_KEY repository secret is required for live acceptance." >&2
            exit 2
          fi
      - id: install
        name: Install ReleaseProof
        run: python -m pip install -e '.[dev]'
      - id: generate
        name: Generate non-sensitive synthetic packet PDFs
        run: python scripts/generate_synthetic_trade_pdfs.py
      - id: probe
        name: Run no-fallback live Nutrient DWS probe
        shell: bash
        run: |
          PYTHONPATH=src python scripts/run_live_dws_probe.py \
            --invoice live-probe-input/invoice.pdf \
            --shipping live-probe-input/shipping.pdf \
            --certificate live-probe-input/certificate.pdf \
            > live-dws-output.json
      - id: shape
        name: Inspect live DWS schema after probe failure
        if: ${{ failure() && steps.probe.outcome == 'failure' }}
        continue-on-error: true
        run: |
          PYTHONPATH=src python scripts/inspect_live_dws_shape.py \
            --document live-probe-input/invoice.pdf \
            --output live-dws-shape.json
      - id: verify
        name: Verify live result truth marker
        if: ${{ steps.probe.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('live-dws-output.json')
          data=json.loads(p.read_text())
          assert data.get('execution') == 'LIVE_NUTRIENT_DWS'
          assert len(data.get('documents', [])) == 3
          assert data.get('manifest_sha256')
          print('LIVE_NUTRIENT_DWS acceptance output validated')
          PY
      - id: artifact
        name: Upload sanitized acceptance evidence
        if: ${{ steps.verify.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-nutrient-dws-acceptance
          path: |
            live-dws-output.json
            live-probe-input/*.pdf
          if-no-files-found: error
          retention-days: 14
      - id: diagnostic_artifact
        name: Upload sanitized schema diagnostic
        if: ${{ steps.shape.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-nutrient-dws-schema
          path: live-dws-shape.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish sanitized run receipt
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_SHA: ${{ github.sha }}
          RUN_EVENT: ${{ github.event_name }}
          RUN_REPOSITORY: ${{ github.repository }}
          SECRET_OUTCOME: ${{ steps.secret.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          SHAPE_OUTCOME: ${{ steps.shape.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          DIAGNOSTIC_ARTIFACT_OUTCOME: ${{ steps.diagnostic_artifact.outcome }}
        run: |
          cat > live-dws-receipt.md <<EOF
          ## Live Nutrient DWS acceptance receipt

          - run_id: ${RUN_ID}
          - run_number: ${RUN_NUMBER}
          - run_url: https://github.com/${RUN_REPOSITORY}/actions/runs/${RUN_ID}
          - commit_sha: ${RUN_SHA}
          - event: ${RUN_EVENT}
          - secret_gate: ${SECRET_OUTCOME}
          - install: ${INSTALL_OUTCOME}
          - synthetic_pdf_generation: ${GENERATE_OUTCOME}
          - live_dws_probe: ${PROBE_OUTCOME}
          - schema_diagnostic: ${SHAPE_OUTCOME}
          - truth_marker_verification: ${VERIFY_OUTCOME}
          - artifact_upload: ${ARTIFACT_OUTCOME}
          - diagnostic_artifact_upload: ${DIAGNOSTIC_ARTIFACT_OUTCOME}
          EOF
          if [ -s live-dws-output.json ]; then
            python - <<'PY' >> live-dws-receipt.md
          import json
          from pathlib import Path
          try:
              data=json.loads(Path('live-dws-output.json').read_text())
          except Exception:
              print('- sanitized_output: UNAVAILABLE_OR_INVALID_JSON')
          else:
              print(f"- execution: {data.get('execution', 'UNKNOWN')}")
              print(f"- release_state: {data.get('release_state', 'UNKNOWN')}")
              print(f"- document_count: {len(data.get('documents', []))}")
              print(f"- manifest_sha256: {data.get('manifest_sha256', 'UNKNOWN')}")
              for doc in data.get('documents', []):
                  print(f"- document_receipt: {doc.get('document_id','UNKNOWN')} / {doc.get('processor_receipt_sha256','UNKNOWN')}")
          PY
          fi
          printf '\nNo API key, Authorization header, extracted document text, or private document content is included in this receipt.\n' >> live-dws-receipt.md
          gh issue comment 3 --repo "${RUN_REPOSITORY}" --body-file live-dws-receipt.md
