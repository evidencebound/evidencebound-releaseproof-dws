name: live-nutrient-dws

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'qa/LIVE_DWS_TRIGGER.md'

permissions:
  contents: read
  issues: write

jobs:
  live-dws-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NUTRIENT_API_KEY: ${{ secrets.NUTRIENT_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - id: secret
        name: Require server-side Nutrient secret
        shell: bash
        run: |
          if [ -z "$NUTRIENT_API_KEY" ]; then
            echo "NUTRIENT_API_KEY repository secret is required for live acceptance." >&2
            exit 2
          fi
      - id: install
        name: Install ReleaseProof
        run: python -m pip install -e '.[dev]'
      - id: generate
        name: Generate non-sensitive synthetic packet PDFs
        run: python scripts/generate_synthetic_trade_pdfs.py
      - id: probe
        name: Run no-fallback live Nutrient DWS probe
        shell: bash
        run: |
          PYTHONPATH=src python scripts/run_live_dws_probe.py \
            --invoice live-probe-input/invoice.pdf \
            --shipping live-probe-input/shipping.pdf \
            --certificate live-probe-input/certificate.pdf \
            > live-dws-output.json
      - id: shape
        name: Inspect live DWS schema after probe failure
        if: ${{ failure() && steps.probe.outcome == 'failure' }}
        continue-on-error: true
        run: |
          PYTHONPATH=src python scripts/inspect_live_dws_shape.py \
            --document live-probe-input/invoice.pdf \
            --output live-dws-shape.json
      - id: verify
        name: Verify live result truth marker
        if: ${{ steps.probe.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('live-dws-output.json').read_text())
          assert data.get('execution') == 'LIVE_NUTRIENT_DWS'
          assert len(data.get('documents', [])) == 3
          assert data.get('manifest_sha256')
          for doc in data['documents']:
              assert doc['dws_operation'].startswith('nutrient-dws:processor-json-content:keyValuePairs')
              assert doc.get('dws_receipt_sha256')
              assert doc.get('fields')
              for field in doc['fields']:
                  citation=field['citation']
                  assert citation.get('page', 0) >= 1
                  assert len(citation.get('bounds', [])) == 4
                  assert 0 <= citation.get('confidence', -1) <= 1
                  assert citation.get('evidence_slice_sha256')
          print('LIVE_NUTRIENT_DWS source-grounding acceptance validated')
          PY
      - id: artifact
        name: Upload sanitized base acceptance evidence
        if: ${{ steps.verify.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-nutrient-dws-acceptance
          path: |
            live-dws-output.json
            live-probe-input/*.pdf
          if-no-files-found: error
          retention-days: 14
      - id: differential
        name: Run hosted Differential Reverification probe
        if: ${{ steps.verify.outcome == 'success' }}
        run: |
          PYTHONPATH=src:scripts python scripts/run_live_differential_probe.py > live-differential-output.json
      - id: differential_verify
        name: Verify live Differential Reverification result
        if: ${{ steps.differential.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.loads(Path('live-differential-output.json').read_text())
          assert data['execution'] == 'LIVE_NUTRIENT_DWS_DIFFERENTIAL_REVERIFICATION'
          assert data['review_evidence_class'] == 'synthetic-acceptance-harness-not-human-metric'
          assert data['invoice_bytes_changed'] is True
          assert data['changed_documents'] == ['invoice']
          assert data['preserved_review_ids']
          assert data['invalidated_review_ids'] == []
          assert data['approved_state'] == 'VERIFIED'
          assert data['current_state'] == 'VERIFIED'
          assert data['original_invoice_sha256'] != data['revised_invoice_sha256']
          print('LIVE Differential Reverification acceptance validated')
          PY
      - id: differential_artifact
        name: Upload Differential Reverification evidence
        if: ${{ always() && steps.differential.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-nutrient-dws-differential-reverification
          path: |
            live-differential-output.json
            live-probe-revision/invoice-revised.pdf
          if-no-files-found: error
          retention-days: 14
      - id: diagnostic_artifact
        name: Upload sanitized schema diagnostic
        if: ${{ always() && steps.shape.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: live-nutrient-dws-schema
          path: live-dws-shape.json
          if-no-files-found: error
          retention-days: 14
      - name: Publish sanitized run receipt
        if: ${{ always() }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_SHA: ${{ github.sha }}
          RUN_EVENT: ${{ github.event_name }}
          RUN_REPOSITORY: ${{ github.repository }}
          SECRET_OUTCOME: ${{ steps.secret.outcome }}
          INSTALL_OUTCOME: ${{ steps.install.outcome }}
          GENERATE_OUTCOME: ${{ steps.generate.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          SHAPE_OUTCOME: ${{ steps.shape.outcome }}
          VERIFY_OUTCOME: ${{ steps.verify.outcome }}
          ARTIFACT_OUTCOME: ${{ steps.artifact.outcome }}
          DIFFERENTIAL_OUTCOME: ${{ steps.differential.outcome }}
          DIFFERENTIAL_VERIFY_OUTCOME: ${{ steps.differential_verify.outcome }}
          DIFFERENTIAL_ARTIFACT_OUTCOME: ${{ steps.differential_artifact.outcome }}
          DIAGNOSTIC_ARTIFACT_OUTCOME: ${{ steps.diagnostic_artifact.outcome }}
        run: |
          cat > live-dws-receipt.md <<EOF
          ## Live Nutrient DWS acceptance receipt

          - run_id: ${RUN_ID}
          - run_number: ${RUN_NUMBER}
          - run_url: https://github.com/${RUN_REPOSITORY}/actions/runs/${RUN_ID}
          - commit_sha: ${RUN_SHA}
          - event: ${RUN_EVENT}
          - secret_gate: ${SECRET_OUTCOME}
          - install: ${INSTALL_OUTCOME}
          - synthetic_pdf_generation: ${GENERATE_OUTCOME}
          - live_dws_probe: ${PROBE_OUTCOME}
          - schema_diagnostic: ${SHAPE_OUTCOME}
          - truth_marker_verification: ${VERIFY_OUTCOME}
          - artifact_upload: ${ARTIFACT_OUTCOME}
          - differential_probe: ${DIFFERENTIAL_OUTCOME}
          - differential_verification: ${DIFFERENTIAL_VERIFY_OUTCOME}
          - differential_artifact_upload: ${DIFFERENTIAL_ARTIFACT_OUTCOME}
          - diagnostic_artifact_upload: ${DIAGNOSTIC_ARTIFACT_OUTCOME}
          EOF
          if [ -s live-dws-output.json ]; then
            python - <<'PY' >> live-dws-receipt.md
          import json
          from pathlib import Path
          try:
              data=json.loads(Path('live-dws-output.json').read_text())
          except Exception:
              print('- sanitized_output: UNAVAILABLE_OR_INVALID_JSON')
          else:
              print(f"- execution: {data.get('execution', 'UNKNOWN')}")
              print(f"- release_state: {data.get('release_state', 'UNKNOWN')}")
              print(f"- document_count: {len(data.get('documents', []))}")
              print(f"- manifest_sha256: {data.get('manifest_sha256', 'UNKNOWN')}")
              for doc in data.get('documents', []):
                  print(f"- document_receipt: {doc.get('document_id','UNKNOWN')} / {doc.get('dws_receipt_sha256','UNKNOWN')}")
          PY
          fi
          if [ -s live-differential-output.json ]; then
            python - <<'PY' >> live-dws-receipt.md
          import json
          from pathlib import Path
          try:
              data=json.loads(Path('live-differential-output.json').read_text())
          except Exception:
              print('- differential_output: UNAVAILABLE_OR_INVALID_JSON')
          else:
              print(f"- differential_execution: {data.get('execution','UNKNOWN')}")
              print(f"- differential_review_class: {data.get('review_evidence_class','UNKNOWN')}")
              print(f"- differential_changed_documents: {data.get('changed_documents', [])}")
              print(f"- differential_preserved_review_count: {len(data.get('preserved_review_ids', []))}")
              print(f"- differential_invalidated_review_count: {len(data.get('invalidated_review_ids', []))}")
              print(f"- differential_current_state: {data.get('current_state','UNKNOWN')}")
              print(f"- differential_current_manifest_sha256: {data.get('current_manifest_sha256','UNKNOWN')}")
          PY
          fi
          printf '\nNo API key, Authorization header, extracted document text, or private document content is included in this receipt.\n' >> live-dws-receipt.md
          gh issue comment 3 --repo "${RUN_REPOSITORY}" --body-file live-dws-receipt.md
